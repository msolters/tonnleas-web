<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>JigRipper Mini</title>
<!--
  JigRipper Mini's placeholder card, framed by mini/embed.js or by a site's own
  <iframe>. It is a few KB and loads nothing else but Cloudflare Web Analytics,
  the anonymous visit counter on every jigripper.com page, which Cloudflare adds
  as the page is served (https://www.jigripper.com/privacy/). A tap frames the widget
  itself, the app in mini mode (/?mini=1&embed=1&autostart=1), over this card,
  which stays until the widget has drawn so there is no blank flash.

  Options: ?theme=light, &links=same, &guesses=1 (the top 10 guesses under the
  card, in a 333-tall frame: the card draws their empty list too, so the swap
  does not move a pixel). JigRipperMini.open() on the parent page
  sends {jigripperMini: 'open'}. Pages that point here never update, so these
  must keep working.

  © 2026 Séisionnach LLC — https://www.jigripper.com/terms/
-->
<script>
  // Before first paint, so the card never flashes the wrong theme.
  (function () {
    var q = new URLSearchParams(location.search);
    document.documentElement.className = (q.get('theme') === 'light' ? 'light' : 'dark')
      + (q.get('guesses') === '1' ? ' guesses' : '');
  })();
</script>
<style>
  :root {
    color-scheme: light;   /* must match the frame's own (mini/embed.js), or Chrome paints a backdrop */
    /* One design pixel. The card is drawn for a 92 px frame and grows with a
       taller one, up to 1.5×, so a host that sizes the frame in its own text
       units (5.75rem) gets a card that grows with its text. The widget that
       replaces it scales by the same rule (MiniPlayer.tsx, miniEmbedScale).
       Borders stay 1 px: hairlines, felt rather than seen. */
    --u: clamp(1px, calc(100vh / 92), 1.5px);
    --surface: rgba(20,28,25,0.92); --border: rgba(143,191,160,0.16); --text: #E8E4DA;
    --text2: #8E9C91; --text3: #5F6F63; --silver: #8FBFA0; --silver-line: rgba(143,191,160,0.45);
    --ring: rgba(60,140,50,0.75);
  }
  :root.light {
    --surface: rgba(255,253,248,0.94); --border: rgba(40,64,50,0.16); --text: #1E2A23;
    --text2: #56645B; --text3: #7D887F; --silver: #3F7357; --silver-line: rgba(63,115,87,0.45);
    --ring: rgba(44,112,40,0.8);
  }
  /* With the guesses: designed for a 333 px frame (8 + 76 + 8 + 233 + 8). */
  :root.guesses { --u: clamp(1px, calc(100vh / 333), 1.5px); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #card {
    all: unset; box-sizing: border-box; position: absolute;
    top: calc(8 * var(--u)); left: calc(8 * var(--u)); right: calc(8 * var(--u));
    height: calc(76 * var(--u)); max-width: calc(520 * var(--u));
    display: flex; align-items: center;
    padding: calc(6 * var(--u)) calc(21 * var(--u)) calc(6 * var(--u)) calc(6 * var(--u));
    border-radius: calc(21 * var(--u)); border: 1px solid var(--border); background: var(--surface);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #card:focus-visible { outline: 2px solid var(--silver); outline-offset: 2px; }
  #card:disabled { cursor: default; }
  .ring { position: relative; flex: 0 0 calc(64 * var(--u)); width: calc(64 * var(--u)); height: calc(64 * var(--u)); margin-right: calc(8 * var(--u)); }
  .ring svg { position: absolute; left: calc(-8 * var(--u)); top: calc(-8 * var(--u)); width: calc(80 * var(--u)); height: calc(80 * var(--u)); }
  .text { flex: 1; min-width: 0; line-height: 1.32; white-space: nowrap; overflow: hidden; text-align: left; }
  .line { display: block; overflow: hidden; }
  .line > span { display: inline-block; }
  .l1 { font-size: calc(16 * var(--u)); color: var(--text); }
  .l2 { font-size: calc(13 * var(--u)); color: var(--text2); margin-top: calc(1 * var(--u)); }
  .l3 { font-size: calc(10.5 * var(--u)); letter-spacing: 0.07em; text-transform: uppercase; color: var(--text3); margin-top: calc(3 * var(--u)); }
  .by { text-transform: none; font-size: calc(11 * var(--u)); letter-spacing: 0.02em; }
  .brand { font-weight: 500; color: var(--silver); text-decoration: underline; text-decoration-color: var(--silver-line); }
  /* The guesses' empty list, as the widget draws it (MiniGuesses, styles.g*). */
  #guesses { display: none; }
  :root.guesses #guesses {
    display: block; box-sizing: border-box; position: absolute;
    top: calc(92 * var(--u)); left: calc(8 * var(--u)); right: calc(8 * var(--u));
    height: calc(233 * var(--u)); max-width: calc(520 * var(--u));
    padding: calc(8 * var(--u)) calc(21 * var(--u)) calc(8 * var(--u)) calc(6 * var(--u));
    border-radius: calc(21 * var(--u)); border: 1px solid var(--border); background: var(--surface);
    cursor: pointer; color: var(--text3); white-space: nowrap; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #guesses .head { display: flex; height: calc(14 * var(--u)); line-height: calc(14 * var(--u));
    font-size: calc(10.5 * var(--u)); letter-spacing: calc(0.7 * var(--u)); text-transform: uppercase; }
  #guesses .head > :first-child { flex: 1; padding-left: calc(72 * var(--u)); }
  #guesses .body { display: flex; margin-top: calc(1 * var(--u)); }
  #guesses .nums { width: calc(64 * var(--u)); opacity: 0.5; }
  #guesses .nums span { display: block; height: calc(20 * var(--u)); line-height: calc(20 * var(--u));
    font-size: calc(10.5 * var(--u)); text-align: right; padding-right: calc(8 * var(--u)); font-variant-numeric: tabular-nums; }
  iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    opacity: 0; transition: opacity .25s; color-scheme: normal; background: transparent;
  }
</style>
</head>
<body>
<button id="card" type="button"
  aria-label="JigRipper Mini: identify a tune. Loads a one-time download of about 130 MB.">
  <span class="ring"><svg width="80" height="80" viewBox="0 0 80 80" aria-hidden="true"></svg></span>
  <span class="text">
    <span class="line l1"><span>Identify a tune</span></span>
    <span class="line l2"><span>Tap the ring, then play a few bars</span></span>
    <span class="line l3"><span><span class="by">Powered by <span class="brand">JigRipper</span></span>&ensp;·&ensp;<span id="note">One-time download, about 130 MB</span></span></span>
  </span>
</button>
<div id="guesses" aria-hidden="true">
  <div class="head"><span>Top guesses</span><span>Confidence</span></div>
  <div class="body"><div class="nums"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span></div></div>
</div>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var light = q.get('theme') === 'light', sameTab = q.get('links') === 'same', guesses = q.get('guesses') === '1';
  var card = document.getElementById('card');

  // The idle listen ring (the knot's maths at rest).
  var svg = card.querySelector('svg'), color = getComputedStyle(card).getPropertyValue('--ring').trim();
  var size = 36, c = 40, outer = size * 0.74, inner = size * 0.38 * 0.55;
  var mid = (inner + outer) / 2, amp = ((outer - inner) / 2) * 0.12, paths = '';
  for (var s = 0; s < 3; s++) {
    var d = '';
    for (var i = 0; i <= 160; i++) {
      var th = (i / 160) * Math.PI * 2, r = mid + amp * Math.sin(4 * th + (s * 2 * Math.PI) / 3);
      d += (i ? 'L' : 'M') + (c + r * Math.cos(th)).toFixed(1) + ',' + (c + r * Math.sin(th)).toFixed(1);
    }
    // non-scaling-stroke: a larger card keeps the same fine strands, as the widget's ring does.
    paths += '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
  }
  svg.innerHTML = paths;

  // The widget's marquee for a line too wide for the card: pause, glide to the
  // end at 36 px/s, pause, snap back — MarqueeText's timing.
  // The design-pixel scale (--u in px): the marquee glides at 36 design px/s.
  function scale() { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u')) || 1; }
  function marquee() {
    if (!card.animate || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var lines = card.querySelectorAll('.line');
    for (var i = 0; i < lines.length; i++) {
      var inner = lines[i].firstChild, dist = inner.offsetWidth - lines[i].clientWidth;
      inner.getAnimations().forEach(function (a) { a.cancel(); });
      if (dist <= 1) continue;
      var pause = 1800, scroll = Math.max(1200, dist / (36 * scale()) * 1000), total = pause * 2 + scroll + 450;
      inner.animate([
        { transform: 'translateX(0)', offset: 0 },
        { transform: 'translateX(0)', offset: pause / total, easing: 'ease-in-out' },
        { transform: 'translateX(' + -dist + 'px)', offset: (pause + scroll) / total },
        { transform: 'translateX(' + -dist + 'px)', offset: (pause * 2 + scroll) / total, easing: 'ease-in-out' },
        { transform: 'translateX(0)', offset: 1 },
      ], { duration: total, iterations: Infinity });
    }
  }
  marquee();
  var w = 0;
  if (window.ResizeObserver) new ResizeObserver(function () {
    // Width, or height: a taller frame scales the text, which changes what fits.
    if (card.disabled || Math.abs(card.clientWidth + card.clientHeight * 1000 - w) < 1) return;
    w = card.clientWidth + card.clientHeight * 1000; marquee();
  }).observe(card);

  // Is the tune model already in this browser? The card shares the widget's
  // storage (same site, framed by the same page), so it can look. If it is, the
  // tap downloads nothing, and the card must not promise a download: it did on
  // every visit (operator, 2026-10-23). STORE is the worker's model store,
  // dsp-worker.js MODEL_STORE_PREFIX + ASSET_VERSIONS.modelDir; web-release.mjs
  // fails a release where the two differ. A browser that refuses storage to a
  // framed page just keeps the download line. The store also holds the smaller
  // models, so look for the tune model's own file (FILE, as model-store.web.ts).
  var STORE = 'jigripper-model-1006-r1';
  var FILE = 'model_nokeycanon_tanh_fp16.onnx';
  if (window.caches) caches.has(STORE).then(function (has) {
    return has && caches.open(STORE).then(function (c) { return c.keys(); }).then(function (keys) {
      var paths = keys.map(function (k) { return new URL(k.url).pathname; });
      function holds(end) { return paths.some(function (p) { return p.slice(-end.length) === end; }); }
      // Both shards (a half-finished download is still a download), or one file.
      return (holds('/' + FILE + '.part0') && holds('/' + FILE + '.part1')) || holds('/' + FILE);
    });
  }).then(function (stored) {
    if (!stored || card.disabled) return;
    document.getElementById('note').textContent = 'Ready · audio stays on this device';
    card.setAttribute('aria-label', 'JigRipper Mini: identify a tune. Ready: the tune model is already on this device.');
    marquee();
  }).catch(function () {});

  // The tap: frame the real widget over the card and start its download.
  var opened = false;
  function open() {
    if (opened) return;
    opened = true;
    var base = location.pathname.replace(/mini\/embed\/(index\.html)?$/, '');
    var frame = document.createElement('iframe');
    frame.src = base + '?mini=1&embed=1&autostart=1' + (light ? '&theme=light' : '') + (sameTab ? '&links=same' : '')
      + (guesses ? '&guesses=1' : '');
    frame.title = 'JigRipper Mini';
    frame.allow = 'microphone; autoplay';
    frame.addEventListener('load', function () {
      setTimeout(function () {
        frame.style.opacity = '1'; card.style.visibility = 'hidden';
        document.getElementById('guesses').style.visibility = 'hidden';
      }, 150);
    });
    card.disabled = true;
    card.querySelectorAll('.line > span').forEach(function (s) { s.getAnimations().forEach(function (a) { a.cancel(); }); });
    document.body.appendChild(frame);
  }
  card.addEventListener('click', open);
  document.getElementById('guesses').addEventListener('click', open);
  // JigRipperMini.open() on the host page (mini/embed.js) asks through here.
  addEventListener('message', function (e) {
    if (e.source === parent && e.data && e.data.jigripperMini === 'open') open();
  });
})();
</script>
</body>
</html>
