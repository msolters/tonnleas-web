    <!-- ═══════════════════════════════════════════════════════════════════════
         SEO / social head.

         This file is `mobile/public/index.html`. Expo's CLI reads it as the SPA
         template (@expo/cli src/start/server/webTemplate.ts →
         getTemplateIndexHtmlAsync prefers the public folder's index.html over
         its own bundled template), so everything here survives
         `npx expo export --platform web`. On export the CLI:
           1. substitutes the LANG_ISO_CODE placeholder in the html tag
              (from app.json expo.web.lang, default "en");
           2. substitutes the WEB_TITLE placeholder — not used below, so the
              real title element written here is left alone;
           3. injects the entry script immediately before the closing body tag;
           4. injects a favicon link immediately before the closing head tag;
           5. would inject a description meta if app.json set
              expo.web.description — DO NOT SET IT, or the page gets two.

         ⚠️ DANGER, verified the hard way: steps 1-4 are plain
         String.prototype.replace calls on the FIRST occurrence anywhere in the
         file. This comment must therefore never contain the literal placeholder
         tokens or the literal closing head/body tags — an earlier draft
         mentioned them here and the entry script was injected INTO THIS COMMENT
         instead of into the document, producing a page that never booted.
         Keep the real closing head and body tags below exactly where they are.
         ══════════════════════════════════════════════════════════════════════ -->
